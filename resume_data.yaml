# ==============================================================================
# resume_data.yaml — SINGLE SOURCE OF TRUTH
#
# Consumed by build_resume.py to produce two outputs:
#   1. dist/Abhishek_Mishra_Resume.pdf  — 1-page, ATS-safe, single-column
#   2. dist/index.html                  — animated portfolio page (Google Sites)
#
# CONVENTIONS (do not break these):
#   * US English spelling throughout (Optimization, Modeling, Visualization).
#     ATS keyword matching is near-exact and most JDs use US forms.
#   * experience[].bullets[].lead must be UNIQUE within a job. The lead renders
#     bold before the text; duplicates read as a formatting bug.
#   * experience[].bullets[].text: 20-30 words, OUTCOME/METRIC FIRST.
#   * Exactly 3 portfolio projects carry `flagship: true`. Only those appear in
#     the PDF's SELECTED PROJECTS block (via short_name + one_liner).
#   * one_liner: <=140 chars, must carry a number, must read standalone.
#   * Every claim here traces to real work. Do not add skills or metrics that
#     are not already substantiated elsewhere in this file.
# ==============================================================================

